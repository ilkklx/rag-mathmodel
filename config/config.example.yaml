# RAG-MathModel 配置模板
# 用法：复制为 config.yaml 后按本机情况修改（不改也能跑，但打不开原文）。
package:
  name: RAG-MathModel
  version: 1.0.1

index:
  db: data/index/mvp.db          # 相对路径 → 相对资源包根目录
  vectors: data/index/vectors.npy

model:
  name: BAAI/bge-small-zh-v1.5
  cache_dir: models/fastembed    # 包内自带模型（约 91 MB）
  local_files_only: true         # 无网络环境也应为 true

retrieval:
  rewrite_scheme: B
  pool: 50
  topk: 10
  recall_multiplier: 2
  rrf_k: 60

paths:
  source_map: data/metadata/source_map.json
  # ↓ 改成「你本机」对应目录；留空则只做检索、不做原文定位
  library_roots:
    ROOT1: ""      # 原 E:\数学建模资源库\02_按模型分类论文库
    ROOT2: ""      # 原 E:\数学建模资源库\01_综合资料库
    ROOT3: ""      # 原 E:\数学建模资源库\04_往年国赛题解与源码
    ROOT4: ""      # 原 F:\competition\数学建模省赛
    ROOT5: ""      # 原 E:\数学建模资源库\07_2026赛题参考（低可信度）
    ROOT6: ""      # 原 E:\数学建模资源库\10_作者心得与经验分享
