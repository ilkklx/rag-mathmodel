# Fill your own source directories in config.local.yaml; examples use D:/rag.
package:
  name: RAG-MathModel
  version: 1.0.2
index:
  db: data/index/mvp.db
  vectors: data/index/vectors.npy
model:
  name: BAAI/bge-small-zh-v1.5
  cache_dir: models/fastembed
  local_files_only: true
retrieval:
  rewrite_scheme: B
  pool: 50
  topk: 10
  recall_multiplier: 2
  rrf_k: 60
paths:
  source_map: data/metadata/source_map.json
  library_roots:
    ROOT1: ''
    ROOT2: ''
    ROOT3: ''
    ROOT4: ''
    ROOT5: ''
    ROOT6: ''
